services:
  dev:
    build:
      # Caminhos aqui são relativos ao PRIMEIRO compose file combinado
      # (docker-compose.yml da raiz, via dockerComposeFile em
      # devcontainer.json) — não a este diretório .devcontainer/.
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/resqui:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Aponta o backend .NET rodado via `dotnet run` dentro do container
      # para o Postgres do serviço vizinho `postgres` (mesma rede do compose).
      ConnectionStrings__Default: "Host=postgres;Database=resqui;Username=resqui;Password=${POSTGRES_PASSWORD:-resqui_dev}"
      Jwt__Issuer: resqui
      Jwt__Audience: resqui-frontend
      Seed__DemoData: "true"
      # Playwright usa o Chromium baixado pelo próprio Playwright dentro
      # do devcontainer (sem Chrome do sistema, ao contrário do host).
      PLAYWRIGHT_CHANNEL: chromium
