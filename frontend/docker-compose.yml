services:
  # Unit + component tests (Vitest, jsdom, sem browser)
  test:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm ci --silent && npm test"

  # E2E tests (Playwright com Chromium pré-instalado no Ubuntu 22.04)
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CI=true
    command: sh -c "npm ci --silent && npm run test:e2e"
