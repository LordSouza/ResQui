server {
    listen 80;
    absolute_redirect off;

    # DNS interno do Docker resolvido a cada requisição: com o host fixo no proxy_pass, o nginx
    # não sobe se o backend ainda não existir e guarda o IP antigo depois que o container é recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Importação em lote de reagentes manda o CSV inteiro como JSON (~0,5 KB por linha); 1m, o padrão, cortava em ~2 mil linhas.
    client_max_body_size 5m;

    location /api/ {
        # Sem URI após a variável: o nginx repassa o caminho original (/api/...) intacto.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        # Acima dos timeouts internos mais longos do backend (assistente 20 s, e-mail 10 s).
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets do Vite têm hash no nome → cache longo e imutável
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /blog/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/blog/(videos|capas)/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html nunca é cacheado, senão o browser continua carregando o bundle antigo
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
