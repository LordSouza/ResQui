version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resqui
      POSTGRES_USER: resqui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resqui_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqui"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ResQui.API/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Database=resqui;Username=resqui;Password=${POSTGRES_PASSWORD:-resqui_dev}"
      Jwt__Key: ${JWT_KEY:-resqui_jwt_dev_key_32chars_min!!}
      Jwt__Issuer: resqui
      Jwt__Audience: resqui-frontend
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin@123}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
