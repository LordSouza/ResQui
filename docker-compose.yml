version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resqui
      POSTGRES_USER: resqui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resqui_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqui"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ResQui.API/Dockerfile
    ports:
      - "5000:8080"
    networks:
      - interna
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Database=resqui;Username=resqui;Password=${POSTGRES_PASSWORD:-resqui_dev}"
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no .env (>= 32 bytes)}
      Jwt__Issuer: resqui
      Jwt__Audience: resqui-frontend
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      Seed__DemoData: "true"
      Assistente__Enabled: ${ASSISTENTE_ENABLED:-false}
      Assistente__ApiKey: ${DEEPSEEK_API_KEY:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__User: ${EMAIL_USER:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-resqui@resqui.local}
      Email__RequireTls: ${EMAIL_REQUIRE_TLS:-true}
      Email__TimeoutSeconds: ${EMAIL_TIMEOUT_SECONDS:-10}
      Proxy__Confiaveis__0: 10.87.0.10
      Proxy__Confiaveis__1: 10.87.0.11

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      interna:
        ipv4_address: 10.87.0.10
    depends_on:
      - backend

networks:
  interna:
    ipam:
      config:
        - subnet: 10.87.0.0/24

volumes:
  pgdata:
