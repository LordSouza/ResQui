name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
        working-directory: backend
      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend
      # ModeloRelacionalTests trava configuração ↔ modelo, mas nada travava modelo ↔ migration:
      # uma configuração editada sem gerar migration passava no CI e só quebrava na startup.
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Model matches migrations
        run: dotnet ef migrations has-pending-model-changes --project ResQui.Infrastructure --startup-project ResQui.API --no-build --configuration Release
        working-directory: backend

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Unit + component tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resqui
          POSTGRES_PASSWORD: resqui
          POSTGRES_DB: resqui
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resqui"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        working-directory: backend
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=resqui;Username=resqui;Password=resqui'
          Seed__DemoData: 'true'
          ASPNETCORE_URLS: 'http://localhost:5000'
        run: |
          dotnet run --project ResQui.API --configuration Release &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/auth/login -X POST -H 'Content-Type: application/json' \
              -d '{"Email":"admin@resqui.local","Senha":"Admin@123"}' && break
            echo "aguardando backend ($i)..."; sleep 3
          done

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E
        run: npx playwright test
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium

  deploy:
    name: Deploy (GHCR + VPS)
    needs: [backend, frontend, e2e]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/ResQui.API/Dockerfile
          push: true
          tags: |
            ghcr.io/lordsouza/resqui-backend:latest
            ghcr.io/lordsouza/resqui-backend:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/lordsouza/resqui-frontend:latest
            ghcr.io/lordsouza/resqui-frontend:${{ github.sha }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "Secrets da VPS ausentes; imagens publicadas, deploy ignorado."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy docker-compose.yml docker-compose.prod.yml Caddyfile \
            "$VPS_USER@$VPS_HOST:/opt/resqui/"
          ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" 'set -e
            cd /opt/resqui
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f'
