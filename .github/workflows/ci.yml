name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    # ResQui.Tests.Integracao roda gatilhos e migrações da auditoria contra PostgreSQL real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resqui
          POSTGRES_PASSWORD: resqui
          POSTGRES_DB: resqui
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resqui"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore --locked-mode
        working-directory: backend
      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend
        env:
          RESQUI_TESTES_POSTGRES: 'Host=localhost;Port=5432;Database=postgres;Username=resqui;Password=resqui'
      # ModeloRelacionalTests trava configuração ↔ modelo, mas nada travava modelo ↔ migration:
      # uma configuração editada sem gerar migration passava no CI e só quebrava na startup.
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.15
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Model matches migrations
        run: dotnet ef migrations has-pending-model-changes --project ResQui.Infrastructure --startup-project ResQui.API --no-build --configuration Release
        working-directory: backend

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Unit + component tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Blog
        run: npm ci --prefix blog && npm run build --prefix blog
        working-directory: frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resqui
          POSTGRES_PASSWORD: resqui
          POSTGRES_DB: resqui
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resqui"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        working-directory: backend
        env:
          ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=resqui;Username=resqui;Password=resqui'
          Seed__DemoData: 'true'
          ASPNETCORE_URLS: 'http://localhost:5000'
          ASPNETCORE_ENVIRONMENT: 'Development'
        run: |
          dotnet run --project ResQui.API --configuration Release --no-launch-profile &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/auth/login -X POST -H 'Content-Type: application/json' \
                 -d '{"Email":"admin@resqui.local","Senha":"Admin@123"}'; then
              echo "backend no ar"; exit 0
            fi
            echo "aguardando backend ($i)..."; sleep 3
          done
          echo "backend não respondeu na porta 5000 em 90s"; exit 1

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E
        run: npx playwright test
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium

  deploy:
    name: Deploy (GHCR + VPS)
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/ResQui.API/Dockerfile
          push: true
          tags: |
            ghcr.io/lordsouza/resqui-backend:latest
            ghcr.io/lordsouza/resqui-backend:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/lordsouza/resqui-frontend:latest
            ghcr.io/lordsouza/resqui-frontend:${{ github.sha }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "Secrets da VPS ausentes; imagens publicadas, deploy ignorado."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy docker-compose.yml docker-compose.prod.yml Caddyfile \
            "$VPS_USER@$VPS_HOST:/opt/resqui/"
          # A expressão do sha é expandida pelo Actions antes do bash, por isso funciona dentro das aspas simples.
          ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" 'set -e
            cd /opt/resqui
            export RESQUI_TAG=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            if ! docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 200 backend
              exit 1
            fi
            # Cada deploy deixa a imagem anterior com tag (sha). Remove só as do ResQui, menos a atual
            # (prune -a apagaria imagens de outros projetos da VPS); o rollback puxa do GHCR.
            docker images --filter "reference=ghcr.io/lordsouza/resqui-*" --format "{{.Repository}}:{{.Tag}}" \
              | grep -v -e ":$RESQUI_TAG\$" -e ":latest\$" | xargs -r docker image rm || true
            docker image prune -f'
